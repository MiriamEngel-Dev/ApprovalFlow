worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # M6/N3: 100 req/min per IP, burst 20, delay 10 — excess returns 429 (ARCHITECTURE.md §10).
  limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
  limit_req_status 429;

  server {
    listen 8080;

    # proxy_pass targets below include a variable ($request_uri), so nginx defers hostname
    # resolution to request time instead of once at config-load — that requires an explicit
    # resolver. 127.0.0.11 is Docker Compose's embedded DNS, which resolves other container names
    # on the same network (submission-service, decision-service, audit-service).
    resolver 127.0.0.11 valid=30s;

    # Permissive CORS — this capstone's UI (port 5173) talks to the gateway (8080) with a
    # bearer-token Authorization header, never cookies, so a wildcard origin carries no
    # cross-site-request risk here.
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Correlation-Id' always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    # N1: nginx (plain nginx:alpine, no njs) can't verify a JWT signature — it passes
    # Authorization through untouched (forwarded by default, no directive needed); each service
    # verifies it via shared/src/auth.ts.
    #
    # $request_id is nginx's own built-in unique hex request identifier — used as the
    # correlation id per the documented deviation from strict UUIDv4 formatting
    # (docs/IMPLEMENTATION-PLAN.md Milestone 11), forwarded as X-Correlation-Id, the exact
    # header shared/src/correlation-id.ts reads on every service.

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # D4: interactive Swagger UI over the checked-in OpenAPI spec, so the API can be explored
    # and exercised from the browser instead of just reading the YAML. Static files only — no
    # new service/container, keeping M4's "single docker compose up" simple.
    location /api-docs/ {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /api-docs/index.html;
    }

    location = /openapi.yaml {
      root /usr/share/nginx/html;
      default_type text/yaml;
    }

    location = /health/ready {
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # Routed to each service's Dapr sidecar (port 3500 inside the compose network), not the
    # app's own port — matches ARCHITECTURE.md §7's literal example
    # (http://submission-service:3500/v1.0/invoke/submission-service/method/...) and keeps every
    # inbound call inside Dapr's own resiliency/tracing path, consistent with how every other
    # inter-service call in this system already works.

    location ~ ^/api/(auth|submissions|invoices) {
      limit_req zone=api burst=20 delay=10;
      proxy_set_header X-Correlation-Id $request_id;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://submission-service:3500/v1.0/invoke/submission-service/method$request_uri;
    }

    location ~ ^/api/(queue|approve|reject|request-info|policy) {
      limit_req zone=api burst=20 delay=10;
      proxy_set_header X-Correlation-Id $request_id;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://decision-service:3500/v1.0/invoke/decision-service/method$request_uri;
    }

    location ~ ^/api/(dashboard|audit|notifications) {
      limit_req zone=api burst=20 delay=10;
      proxy_set_header X-Correlation-Id $request_id;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://audit-service:3500/v1.0/invoke/audit-service/method$request_uri;
    }

    # D5/Milestone 14: scripts/verify.ts (running from the host) needs Journey D's deterministic
    # payment-failure hook. payment-service publishes no host port since Milestone 11 (nginx is
    # the single external entry point), so this is the only way to reach it from outside the
    # Docker network — still gated by X-Test-Harness-Secret inside the route handler itself
    # (services/payment-service/src/routes/internal.ts), unchanged; this route doesn't widen that.
    location = /internal/mock-provider/force-fail {
      proxy_set_header X-Correlation-Id $request_id;
      proxy_pass http://payment-service:3500/v1.0/invoke/payment-service/method$request_uri;
    }
  }
}
