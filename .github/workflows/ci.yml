name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, core]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

  # TODO (Milestone 13): unit tests, integration tests (Postgres/Redis services),
  # docker compose build, and npm run verify against a live cluster.
