apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: resiliency
scopes:
  - decision-service
  - payment-service
  - submission-service
  - audit-service
spec:
  policies:
    timeouts:
      llmProviderTimeout: 30s
      paymentSagaTimeout: 10s
      defaultTimeout: 5s
    retries:
      defaultRetry:
        policy: constant
        duration: 1s
        maxRetries: 3
    circuitBreakers:
      defaultCB:
        maxRequests: 1
        interval: 60s
        timeout: 60s
        trip: consecutiveFailures >= 5

  targets:
    apps:
      decision-service:
        timeout: llmProviderTimeout
        retry: defaultRetry
        circuitBreaker: defaultCB
      payment-service:
        timeout: paymentSagaTimeout
        retry: defaultRetry
        circuitBreaker: defaultCB
      submission-service:
        timeout: defaultTimeout
        retry: defaultRetry
        circuitBreaker: defaultCB
      audit-service:
        timeout: defaultTimeout
        retry: defaultRetry
        circuitBreaker: defaultCB
