services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-approvalflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    expose:
      - '5432'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-approvalflow}']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

  redis:
    image: redis:7-alpine
    expose:
      - '6379'
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  submission-service:
    build:
      context: .
      dockerfile: services/submission-service/Dockerfile
    ports:
      - '3000:3000'
      # 3500 (Dapr HTTP) published for direct verification during development; removed once
      # nginx (Milestone 11) becomes the single external entry point (M6).
      - '3500:3500'
    environment:
      APP_PORT: '3000'
      DAPR_HTTP_PORT: '3500'
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-approvalflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SUBMISSION_DB: submission_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  submission-service-dapr:
    image: daprio/daprd:1.14.4
    command:
      - './daprd'
      - '--app-id=submission-service'
      - '--app-port=3000'
      - '--dapr-http-port=3500'
      - '--resources-path=/components'
      - '--log-level=info'
    network_mode: 'service:submission-service'
    volumes:
      - ./dapr/components:/components
      - ./dapr/secrets.json:/dapr/secrets.json:ro
    depends_on:
      - submission-service

  decision-service:
    build:
      context: .
      dockerfile: services/decision-service/Dockerfile
    ports:
      - '3001:3001'
      # 3502 (Dapr HTTP) published for direct verification during development; removed once
      # nginx (Milestone 11) becomes the single external entry point (M6). Host-side port differs
      # from submission-service's 3500 to avoid a host port clash; each sidecar's own network
      # namespace still uses 3500 internally (ARCHITECTURE.md §7).
      - '3502:3500'
    environment:
      APP_PORT: '3001'
      DAPR_HTTP_PORT: '3500'
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-approvalflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DECISION_DB: decision_db
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      AUTONOMY_CEILING: ${AUTONOMY_CEILING:-250}
      AUTONOMY_CONFIDENCE: ${AUTONOMY_CONFIDENCE:-0.80}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  decision-service-dapr:
    image: daprio/daprd:1.14.4
    command:
      - './daprd'
      - '--app-id=decision-service'
      - '--app-port=3001'
      - '--dapr-http-port=3500'
      - '--resources-path=/components'
      - '--log-level=info'
    network_mode: 'service:decision-service'
    volumes:
      - ./dapr/components:/components
      - ./dapr/secrets.json:/dapr/secrets.json:ro
    depends_on:
      - decision-service

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    ports:
      - '3002:3002'
      # 3503 (Dapr HTTP) published for direct verification during development; removed once
      # nginx (Milestone 11) becomes the single external entry point (M6). Host-side port differs
      # from the other services' to avoid a host port clash; each sidecar's own network namespace
      # still uses 3500 internally (ARCHITECTURE.md §7).
      - '3503:3500'
    environment:
      APP_PORT: '3002'
      DAPR_HTTP_PORT: '3500'
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-approvalflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PAYMENT_DB: payment_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-service-dapr:
    image: daprio/daprd:1.14.4
    command:
      - './daprd'
      - '--app-id=payment-service'
      - '--app-port=3002'
      - '--dapr-http-port=3500'
      - '--resources-path=/components'
      - '--log-level=info'
    network_mode: 'service:payment-service'
    volumes:
      - ./dapr/components:/components
      - ./dapr/secrets.json:/dapr/secrets.json:ro
    depends_on:
      - payment-service

  # Remaining services + their Dapr sidecars are added here one at a time: audit-service
  # (Milestone 10), then nginx (Milestone 11) — same pattern as the services above.

volumes:
  postgres-data:
