services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-approvalflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    expose:
      - '5432'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-approvalflow}']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

  redis:
    image: redis:7-alpine
    expose:
      - '6379'
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  submission-service:
    build:
      context: .
      dockerfile: services/submission-service/Dockerfile
    # Not published to the host — nginx (Milestone 11) is the single external entry point (M6);
    # only reachable on the Compose network (by other containers, including nginx).
    expose:
      - '3000'
      - '3500'
    environment:
      APP_PORT: '3000'
      DAPR_HTTP_PORT: '3500'
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-approvalflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SUBMISSION_DB: submission_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  submission-service-dapr:
    image: daprio/daprd:1.18.0
    command:
      - './daprd'
      - '--app-id=submission-service'
      - '--app-port=3000'
      - '--dapr-http-port=3500'
      - '--resources-path=/components'
      - '--log-level=info'
    network_mode: 'service:submission-service'
    volumes:
      - ./dapr/components:/components
      - ./dapr/secrets.json:/dapr/secrets.json:ro
    depends_on:
      - submission-service

  decision-service:
    build:
      context: .
      dockerfile: services/decision-service/Dockerfile
    # Not published to the host — nginx (Milestone 11) is the single external entry point (M6);
    # only reachable on the Compose network (by other containers, including nginx).
    expose:
      - '3001'
      - '3500'
    environment:
      APP_PORT: '3001'
      DAPR_HTTP_PORT: '3500'
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-approvalflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DECISION_DB: decision_db
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      AUTONOMY_CEILING: ${AUTONOMY_CEILING:-250}
      AUTONOMY_CONFIDENCE: ${AUTONOMY_CONFIDENCE:-0.80}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  decision-service-dapr:
    image: daprio/daprd:1.18.0
    command:
      - './daprd'
      - '--app-id=decision-service'
      - '--app-port=3001'
      - '--dapr-http-port=3500'
      - '--resources-path=/components'
      - '--log-level=info'
    network_mode: 'service:decision-service'
    volumes:
      - ./dapr/components:/components
      - ./dapr/secrets.json:/dapr/secrets.json:ro
    depends_on:
      - decision-service

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    # Not published to the host. nginx never calls payment-service directly (only reached via
    # decision-service's saga trigger and pub/sub — ARCHITECTURE.md §2 Communication Map), but
    # this stays consistent with the other 3 services: only reachable on the Compose network.
    expose:
      - '3002'
      - '3500'
    environment:
      APP_PORT: '3002'
      DAPR_HTTP_PORT: '3500'
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-approvalflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PAYMENT_DB: payment_db
      TEST_HARNESS_SECRET: ${TEST_HARNESS_SECRET:-change-me-to-a-long-random-string}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-service-dapr:
    image: daprio/daprd:1.18.0
    command:
      - './daprd'
      - '--app-id=payment-service'
      - '--app-port=3002'
      - '--dapr-http-port=3500'
      - '--resources-path=/components'
      - '--log-level=info'
    network_mode: 'service:payment-service'
    volumes:
      - ./dapr/components:/components
      - ./dapr/secrets.json:/dapr/secrets.json:ro
    depends_on:
      - payment-service

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    # Not published to the host — nginx (Milestone 11) is the single external entry point (M6);
    # only reachable on the Compose network (by other containers, including nginx).
    expose:
      - '3003'
      - '3500'
    environment:
      APP_PORT: '3003'
      DAPR_HTTP_PORT: '3500'
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-approvalflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      AUDIT_DB: audit_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  audit-service-dapr:
    image: daprio/daprd:1.18.0
    command:
      - './daprd'
      - '--app-id=audit-service'
      - '--app-port=3003'
      - '--dapr-http-port=3500'
      - '--resources-path=/components'
      - '--log-level=info'
    network_mode: 'service:audit-service'
    volumes:
      - ./dapr/components:/components
      - ./dapr/secrets.json:/dapr/secrets.json:ro
    depends_on:
      - audit-service

  # nginx (Milestone 11) — the single external entry point (M6): rate-limiting, CORS,
  # correlation-id injection, JWT passthrough. No Dapr sidecar of its own — it calls each
  # service's sidecar directly by container name (ARCHITECTURE.md §7), so it only needs to share
  # the Compose network, not a `network_mode: 'service:...'` pairing like the app+sidecar blocks
  # above. The only service in this file that publishes a host port.
  nginx:
    image: nginx:alpine
    ports:
      - '${NGINX_PORT:-8080}:8080'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - submission-service
      - decision-service
      - audit-service

volumes:
  postgres-data:
